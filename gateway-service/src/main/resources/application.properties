# Puerto del Gateway: esta es la ÚNICA puerta a la que le habla el frontend
server.port=8080

spring.application.name=gateway-service

# Se registra en Eureka para descubrir a los demás microservicios por nombre
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Rutas: cada petición que llegue al Gateway se redirige según el path
spring.cloud.gateway.routes[0].id=usuario-service
spring.cloud.gateway.routes[0].uri=lb://usuario-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/usuarios/**

spring.cloud.gateway.routes[1].id=plugin-service
spring.cloud.gateway.routes[1].uri=lb://plugin-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/plugins/**

spring.cloud.gateway.routes[2].id=carrito-service
spring.cloud.gateway.routes[2].uri=lb://carrito-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/carrito/**

spring.cloud.gateway.routes[3].id=orden-service
spring.cloud.gateway.routes[3].uri=lb://orden-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/ordenes/**

spring.cloud.gateway.routes[4].id=pago-service
spring.cloud.gateway.routes[4].uri=lb://pago-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/pagos/**
