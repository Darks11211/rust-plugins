server.port=8081
spring.application.name=usuario-service
 
# Conexión a la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/usuario_db
spring.datasource.username=root
spring.datasource.password=root1234
 
# ddl-auto=update -> Hibernate crea/actualiza las tablas automáticamente
# a partir de las clases @Entity, sin que tengas que escribir el SQL a mano.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
 
# Se registra en Eureka para que el Gateway lo pueda encontrar
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true